services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: adipa
      POSTGRES_PASSWORD: adipa
      POSTGRES_DB: adipa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adipa -d adipa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://adipa:adipa@db:5432/adipa_db
      UPLOAD_DIR: /uploads
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads:/uploads
      - ./backend:/app
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    depends_on:
      - api

  test:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://adipa:adipa@db:5432/adipa_db
      UPLOAD_DIR: /tmp/uploads
      SECRET_KEY: test-secret-key
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: adminpass
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "--tb=short", "-v"]
    profiles:
      - test

volumes:
  postgres_data:
  uploads:
